[project]
name = "budgetiq"
version = "0.1.0"
description = "AI-assisted budget reallocation intelligence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-ai>=2.5.0",
    "pydantic-evals>=2.5.0",
    "logfire[fastapi,sqlalchemy]>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
